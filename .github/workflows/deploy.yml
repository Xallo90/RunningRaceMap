name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"   # nightly data refresh, 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # On scheduled/manual runs, refresh races.geojson from Kondis first.
      # fetch_races.py is stdlib-only, no pip install needed.
      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh race data
        if: github.event_name != 'push'
        run: python fetch_races.py 12

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/races.geojson geocode_cache.json
          git diff --cached --quiet || git commit -m "Nightly race data refresh"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
